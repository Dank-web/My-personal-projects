<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root {
            --bg: #ffffff;
            --fg: #111;
        }

        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            display: grid;
            place-items: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background: var(--bg);
            color: var(--fg);
            transition: background 450ms ease, color 450ms ease;
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(6px);
            border-radius: 14px;
            padding: 28px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            text-align: center;
            min-width: 260px;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 1.25rem;
        }

        p.small {
            margin: 0 0 18px 0;
            font-size: 0.9rem;
            color: rgba(0,0,0,0.6);
        }

        button#change {
            display: inline-block;
            border: none;
            padding: 10px 18px;
            font-size: 1rem;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(0,0,0,0.12);
            transition: transform 140ms ease, box-shadow 140ms ease;
            background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(255,255,255,0.85));
        }

        button#change:active {
            transform: translateY(1px);
        }

        .color-box {
            margin-top: 12px;
            padding: 10px 14px;
            border-radius: 8px;
            font-family: monospace;
            display: inline-block;
            background: rgba(0,0,0,0.06);
        }
                
        footer {
            margin-top: 14px;
            font-size: 0.8rem;
            color: rgba(0,0,0,0.55);
        }
            /* Make card a bit transparent when bg is dark so contrast remains */
    .dark .card { background: rgba(0,0,0,0.55); color: #fff; }
    </style>
</head>
<body>
    <main class="card" id="app">
        <h1>Random Screen Color</h1>
        <p class="small">Click the button (or press <strong>Space</strong>) to change the screen background to a random color.</p>
        <button id="change" aria-live="polite">Change Color</button>
        <div class="color-box" id="colorDisplay" aria-atomic="true" role="status">#FFFFFF</div>
        <footer>Tip: Click multiple times to explore different colours.</footer>
    </main>
    <script>

    </script>
</body>
</html>
